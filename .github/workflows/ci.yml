name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamcoder
          POSTGRES_PASSWORD: teamcoder
          POSTGRES_DB: teamcoder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teamcoder -d teamcoder"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://teamcoder:teamcoder@localhost:5432/teamcoder
      PORT: '6300'
      RATE_LIMIT: '0'        # functional tests aren't rate-limited (limiter is unit-tested)

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: bun run --filter '*' typecheck

      - name: Unit tests
        working-directory: apps/server
        run: bun test src/lib

      - name: Build web
        run: bun run --filter '@team-coder/web' build

      - name: Migrate + seed
        working-directory: apps/server
        run: |
          bun run db:migrate
          bun run db:seed

      - name: Start server
        working-directory: apps/server
        run: |
          bun run src/index.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:6300/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:6300/health || (cat /tmp/server.log && exit 1)

      - name: Integration verify suite
        working-directory: apps/server
        run: bun run verify:all

      - name: Server logs on failure
        if: failure()
        run: cat /tmp/server.log || true
